<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Worldwalker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-veil" aria-hidden="true"></div>
  <div class="boot-card">
    <div class="rune" aria-hidden="true">✦</div>
    <h1>WORLDWALKER</h1>
    <p>A REALM MADE FROM LIVING PROJECTS.</p>
    <div id="resumeSummary" class="resume-summary">NO JOURNEY MEMORY YET.</div>
    <button id="wake">BEGIN JOURNEY</button>
  </div>
</div>
<div id="app" class="app hidden">
  <header class="topbar"><div><b>WORLDWALKER</b><span id="place">THE CROSSROADS</span></div><div class="status"><button id="audioToggle" class="audio-toggle" type="button" aria-pressed="false">♪ SOUND</button><span id="syncDot"></span><span id="syncText">READING WORLD…</span></div></header>
  <main class="stage">
    <canvas id="world" width="960" height="576" tabindex="0" aria-label="Worldwalker explorable project world"></canvas>
    <div class="scanlines" aria-hidden="true"></div><div id="transition" class="transition" aria-live="polite"></div><div id="regionCard" class="region-card" aria-live="polite"></div><div id="toast" class="toast" aria-live="polite"></div><div id="questHud" class="quest-hud hidden"><span>ACTIVE RUMOR</span><b></b><small></small></div><div id="prompt" class="prompt hidden"><b>ENTER</b><span></span></div>
    <section id="dialogueBox" class="dialogue-box hidden" aria-live="polite"><img id="dialoguePortrait" alt=""><div class="dialogue-copy"><b id="dialogueSpeaker"></b><p id="dialogueText"></p><div id="dialogueChoices" class="dialogue-choices"></div><small id="dialogueHint"></small></div></section>
    <div id="touchControls" class="touch-controls" aria-label="Touch movement controls"><div class="dpad"><button data-hold="arrowup" aria-label="Move up">▲</button><button data-hold="arrowleft" aria-label="Move left">◀</button><button data-hold="arrowdown" aria-label="Move down">▼</button><button data-hold="arrowright" aria-label="Move right">▶</button></div><div class="actions"><button data-touch="traverse" aria-label="Climb or squeeze">C</button><button data-touch="hop" aria-label="Hop">HOP</button><button data-hold="shift" aria-label="Sprint">RUN</button><button data-touch="interact" aria-label="Interact">A</button></div></div>
  </main>
  <nav class="dock" aria-label="Worldwalker tools"><button data-panel="atlas"><span>⌖</span>MAP</button><button data-panel="quests"><span>⚑</span>QUESTS</button><button data-panel="artifacts"><span>▣</span>ARTIFACTS</button><button data-panel="chronicle"><span>◷</span>CHRONICLE</button><button data-panel="journal"><span>✎</span>JOURNAL</button><button data-panel="manual"><span>▤</span>MANUAL</button><button id="artCodexButton" type="button"><span>✦</span>ART CODEX</button><button data-panel="help"><span>?</span>HELP</button></nav>
  <aside id="panel" class="panel" aria-live="polite" aria-label="Worldwalker information panel"><button id="closePanel" class="close" aria-label="Close panel">×</button><div id="panelBody"></div></aside>
</div>
<script type="module" src="app.js"></script>
<script type="module" src="art-gallery.js"></script>
</body>
</html>
